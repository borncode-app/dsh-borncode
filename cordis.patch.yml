# One install entry for the eight BornCode plugins.
#
# This bundle inserts the rows the eight standalone bundles used to insert,
# naming the same packages by a path beside this file, so the bundle carries
# its own packages and one install is enough.
#
# Each part keeps its own code, its own Config schema, and its own switch: one
# crashing row does not take the others down, and a bad field blocks only its
# own row. Turn a part off in the bundle's detail page.
#
# Deselect the eight standalone bundles while this one is selected, or their
# rows appear twice.
- insert:
    # Keeps the per-agent instructions the user writes in Settings â†’ Agent
    # customization, and contributes them to that agent's own system prompt.
    - id: agent-customizer
      name: '@local/dsh-agent-customizer'
      config:
        # Path the Web GUI reads and writes the customizations at.
        endpoint: /plugins/agent-customizer
        # Largest instruction text accepted, in characters.
        maxLength: 20000

    # Owns the native agent-desktop binary: it installs it, keeps it current,
    # exposes its commands as first-class tools, and serves its Settings page.
    - id: agent-desktop
      name: '@local/dsh-agent-desktop'
      config:
        # Path the Web GUI reads and writes the plugin's data at.
        endpoint: /plugins/agent-desktop
        # Check GitHub for a newer release every time the Harness starts.
        autoUpdate: true
        # Upstream repository the release and its checksums come from.
        repo: vercel-labs/agent-desktop
        # Register the desktop_* tools the model calls.
        registerTools: true
        # Add the operating guide to the model's system prompt.
        guideInPrompt: true
        # Longest one desktop command may run, in milliseconds.
        toolTimeoutMs: 60000

    # Books one durable scheduled message when a model usage limit runs out, so
    # the conversation resumes by itself once the limit resets.
    - id: auto-continue
      name: '@local/dsh-auto-continue'
      config:
        endpoint: /plugins/auto-continue
        enabled: false
        # QUOTA and ACCOUNT_QUOTA are permanent as far as the plain retry policy
        # is concerned; RATE_LIMIT reaches this row only after that policy gave up.
        codes:
          - QUOTA
          - ACCOUNT_QUOTA
          - RATE_LIMIT
        minWaitSeconds: 60
        # A weekly window can be days away; anything farther out is left to the user.
        maxWaitSeconds: 604800
        baseWaitSeconds: 300
        maxBackoffSeconds: 3600
        # 0 keeps the adaptive wait (provider hint, then the quota reset, then
        # backoff). A positive value is a fixed cadence in minutes: every
        # continuation waits exactly that long. The composer chip's badge
        # overrides it per conversation.
        intervalMinutes: 0
        maxAttempts: 12
        # Read the reset time the quota plugin already probed for this provider.
        quotaEndpoint: /plugins/model-quota
        probeTimeoutMs: 8000
        # Off in normal use. `true` lets `POST {"action":"test"}` book a real
        # continuation now, which is how the booking path is proven end to end.
        debugTest: false

    # Asks the operating system to power the computer down when a root session
    # finishes, using the system's own visible countdown so it can be cancelled.
    - id: auto-shutdown
      name: '@local/dsh-auto-shutdown'
      config:
        # Path the Web GUI reads and posts the toggle to.
        endpoint: /plugins/auto-shutdown
        # Off by default. The user turns this on deliberately.
        enabled: false
        # Countdown the operating system shows before it powers the computer down.
        delaySeconds: 120
        # Shortest countdown the plugin arms.
        minDelaySeconds: 30
        # Longest countdown the plugin arms.
        maxDelaySeconds: 3600
        # The note Windows shows next to its own shutdown countdown dialog.
        message: 'The Harness session finished, so this computer is shutting down. Run "shutdown /a" to cancel.'

    # Owns the native browser-use package: it installs it into a managed virtual
    # environment, keeps it current, and exposes its browser actions as tools.
    - id: browser-use
      name: '@local/dsh-browser-use'
      config:
        # Path the Web GUI reads and writes the plugin's data at.
        endpoint: /plugins/browser-use
        # Check PyPI for a newer release every time the Harness starts.
        autoUpdate: true
        # Package the plugin installs and keeps current.
        package: browser-use
        # Register the browser_* tools the model calls.
        registerTools: true
        # Add the operating guide to the model's system prompt.
        guideInPrompt: true
        # Longest one browser command may run, in milliseconds.
        toolTimeoutMs: 120000

    # Keeps the instructions the user writes in Settings â†’ General â†’
    # Instructions, and reads them at the top of the system prompt.
    - id: session-instructions
      name: '@local/dsh-session-instructions'
      config:
        # Path the Web GUI reads and writes the instructions at.
        endpoint: /plugins/session-instructions
        # Largest instruction text accepted, in characters.
        maxLength: 20000

    # Imports Claude Code and MiniMax Code conversations as persisted Sessions
    # in the workspace that owns their folder, and records the origin badge.
    - id: session-sync
      name: '@local/dsh-session-sync'
      config:
        # Route the Client half reads and posts to.
        endpoint: /plugins/session-sync
        # Scan at startup and then on a slow interval.
        autoSync: true
        intervalMinutes: 15
        # Per-message character budget; longer bodies are truncated visibly.
        maxTextChars: 20000

    # A right-sidebar chat that answers questions about the current session.
    - id: side-chat
      name: '@local/dsh-side-chat'
      config:
        endpoint: /plugins/side-chat
        provider: deepseek-account
        model: deepseek-flash
        maxChars: 48000
        maxMessageChars: 4000


# ── MiniMax plugins ─────────────────────────────────────────────────────────
#
# These rows moved here from the former dsh-minimax-kit repository, so one
# bundle installs every kit and one update pass covers them all. Each part
# keeps its own code, its own Config schema, and its own switch: one crashing
# row does not take the others down.
#
- insert:
    # Local Anthropic-Messages proxy and credit failover. Point an llm-pi-ai
    # route's baseURL at http://127.0.0.1:45677/anthropic.
    #
    # `preferOfmGrant` reads the MiniMax Code grant Our Free Model stores
    # first, and falls back to the Token Plan API key. When Our Free Model
    # drives the MiniMax Code channel, its grant is the account the quota and
    # credit endpoints answer for.
    - id: minimax-credit
      name: '@local/dsh-minimax-credit'
      config:
        enabled: true
        listenHost: 127.0.0.1
        listenPort: 45677
        minimaxHome: ''
        buildEnv: prod
        region: en
        planBaseURL: https://api.minimax.io/anthropic
        creditBaseURL: https://agent.minimax.io/mavis/api/v1/llm/v1
        quotaURL: https://api.minimax.io/v1/api/openplatform/coding_plan/remains
        creditURL: https://api.minimax.io/backend/account/token_plan_credit
        membershipURL: https://agent.minimax.io/matrix/api/v1/commerce/get_membership_info
        walletURL: https://api.minimax.io/account/query_balance
        apiKeyEnv: MINIMAX_API_KEY
        preferOfmGrant: true
        ofmHome: ''
        ofmAccount: minimax-code-global
        quotaCacheMs: 60000
        creditsCacheMs: 60000
        refreshSkewMs: 600000

    # Daily check-in claim plus the composer chip and the minimax_daily_checkin tool.
    - id: minimax-checkin
      name: '@local/dsh-minimax-checkin'
      config:
        enabled: true
        minimaxHome: ''
        buildEnv: prod
        region: en
        apiBaseURL: https://agent.minimax.io
        oauthTokenURL: ''
        appVersion: 3.1.14
        refreshSkewMs: 600000
        timeoutMs: 20000
        statusPath: /plugins/minimax-checkin/status
        claimPath: /plugins/minimax-checkin/claim
        autoCheckIn: true
        autoCheckInHour: 9

    # Keeps the llm-pi-ai minimax-api route's model list current.
    - id: minimax-model-sync
      name: '@local/dsh-minimax-model-sync'
      config:
        settingsNs: llm-pi-ai
        route: minimax-api
        baseURL: https://api.minimax.io/anthropic
        api: anthropic-messages
        exclude:
          - MiniMax-M2
          - MiniMax-M2.1
          - MiniMax-M2.1-highspeed
          - MiniMax-M2.5
          - MiniMax-M2.5-highspeed
          - MiniMax-M2.7
          - MiniMax-M2.7-highspeed
        refreshMinutes: 360

    # Web search through MiniMax's native `web_search` server tool. The
    # provider answers on MiniMax's servers, so a search costs one model turn
    # and never touches a DeepSeek balance. When the Token Plan quota is spent,
    # the same request continues on the MiniMax Code credit endpoint.
    - id: minimax-web-search
      name: '@local/dsh-minimax-web-search'
      config:
        baseURL: https://api.minimax.io/anthropic
        model: MiniMax-M3.1-Flash
        maxUses: 3
        maxContinuations: 4
        apiKeyEnv: MINIMAX_API_KEY
        preferOfmGrant: true
        creditBaseURL: https://agent.minimax.io/mavis/api/v1/llm/v1

    # Serves the skills that live under the MiniMax Code home, in place.
    - id: minimax-bridge
      name: '@local/dsh-minimax-bridge'
      config:
        minimaxHome: ''
        includeUserSkills: true
        includePluginSkills: true
        includeAgentSkills: true
        extraSkillDirs: []
        watch: true

    # Publishes the same home's agents as Harness agent presets.
    #
    # The MiniMax Code roles are not published: the user keeps only the
    # Harness's own agents (standard, ptc, minimal, cordis), so the roster
    # stays short and every agent reads one set of standing instructions.
    - id: minimax-agent-bridge
      name: '@local/dsh-minimax-bridge/agents'
      config:
        minimaxHome: ''
        mode: coding
        includeBuiltin: false
        includeUserAgents: false
        stripSections:
          - Harness
          - Media Output
        watch: true
        maxPersonaChars: 60000

    # MiniMax Code's MCP servers. They stay disabled: rea publishes 229 tools and
    # mcp-reverse 111, which every request would pay for. Enable the ones you want.
    - id: minimax-mcp-rea
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: rea
        transport: stdio
        command: 'C:\Program Files\nodejs\node.exe'
        args:
          - 'C:\Users\snowb4ll\AppData\Roaming\npm\node_modules\rea-agents\scripts\rea.mjs'
          - 'mcp'
        env:
          GHIDRA_INSTALL_DIR: 'C:\ProgramData\Ghidra\ghidra_12.1.4_PUBLIC'
          JAVA_HOME: 'C:\Program Files\Android\Android Studio\jbr'
          REA_WABT_BIN_DIRECTORY: 'C:\ProgramData\wabt\wabt-1.0.42\bin'
          REA_JADX_MCP_JAR: 'C:\ProgramData\jadx\jadx-headless-mcp-0.7.1-all.jar'
          REA_APKTOOL_COMMAND: 'C:\Users\snowb4ll\Tools\apktool\apktool.bat'
          REA_BROWSER_EXECUTABLE: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          REA_TSHARK_COMMAND: 'C:\Program Files\Wireshark\tshark.exe'
          REA_CAPINFOS_COMMAND: 'C:\Program Files\Wireshark\capinfos.exe'
          REA_KUNA_COMMAND: 'C:\ProgramData\kuna\kuna-v1.833-windows-x86_64\kuna.exe'
          REA_IDA_MCP_CONFIG: 'C:\ProgramData\ida\ida-mcp.json'
          REA_RIZIN_COMMAND: 'C:\Program Files\Rizin\bin\rizin.exe'
          REA_OBJDUMP_COMMAND: 'C:\Users\snowb4ll\AppData\Local\Microsoft\WinGet\Packages\BrechtSanders.WinLibs.POSIX.UCRT_Microsoft.Winget.Source_8wekyb3d8bbwe\mingw64\bin\objdump.exe'
        toolCallTimeoutMs: 600000

    - id: minimax-mcp-photocraft
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: photocraft
        transport: stdio
        command: 'C:\Users\snowb4ll\Apps\photocraft\photocraft-0.16.0-windows-x64-portable\photocraft-cli.exe'
        args:
          - mcp
          - '--bridge'
          - 127.0.0.1:17890
          - '--control-token-file'
          - 'C:\Users\snowb4ll\Apps\photocraft\control-token.txt'

    - id: minimax-mcp-reverse
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: mcp-reverse
        transport: stdio
        command: 'C:\Program Files\nodejs\node.exe'
        args:
          - 'C:\Users\snowb4ll\Tools\mcp-reverse\dist\index.js'
        env:
          MCP_SKILLS_DB: 'C:\Users\snowb4ll\Tools\mcp-reverse\db\skills-full.db'
        toolCallTimeoutMs: 600000
