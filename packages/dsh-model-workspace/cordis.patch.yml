# Inserts the Model workspace shortcut row. The row's Client half adds one entry
# to the sidebar's More menu that opens Our Free Model's Model workspace page.
#
# The Host half is deliberately inert: the shortcut only navigates, so there is
# no route, tool, timer, or setting to configure here.
- insert:
    - id: model-workspace
      name: '@local/dsh-model-workspace'
