# Tells the model that this machine's development containers run on the kiri
# engine, and where a production build goes.
#
# Nothing is blocked: kiri speaks the Docker Engine API, so once its context is
# active, `docker compose up` and `docker run` reach it with no extra flag. The
# only fact worth stating is where a build goes, because a build follows the
# selected buildx builder rather than the active docker context.
- insert:
    - id: docker-kiri
      name: '@local/dsh-docker-kiri'
      config:
        # Turn the guidance off without uninstalling the plugin.
        enabled: true
        # The docker context the development loop is expected to use.
        context: kiri
        # Write the runtime split into the system prompt.
        guideInPrompt: true
        # Also state which buildx builder a plain `docker build` resolves to, so
        # a build that lands on the wrong engine is visible before it runs.
        reportBuilder: true
